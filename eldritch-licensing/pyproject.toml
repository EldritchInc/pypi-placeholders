[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eldritch-licensing"
# Below every release of the real eldritch-licensing, so pip never takes this
# placeholder for it.
version = "0.0.1"
description = "Placeholder held by Eldritch, Inc.: eldritch-licensing is not distributed on PyPI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Eldritch, Inc." }
]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Programming Language :: Python :: 3",
]

[project.scripts]
eldritch-licensing = "eldritch_licensing_placeholder:main"

[project.urls]
Homepage = "https://eldritchinc.com/workwithus/"
Repository = "https://github.com/EldritchInc/pypi-placeholders"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
